{{ define "main" }} {{ partial "big-title.html" .Title }}

<article class="prose p-0! border-12! border-theme">
  {{ .Content }}

  <div class="flex flex-wrap relative">
    <div class="absolute top-31 w-21 -left-1.5 lg:left-[unset] lg:-right-11">
      <img src="/lyra-green.webp" />
    </div>

    {{ range $index, $book := site.Data.bookshelf.books }}
    <div class="md:w-1/3 w-1/2 border-b-12 border-b-theme min-h-72 pt-8 px-3 md:px-6 flex justify-center items-end">
      <img
        src="{{ $book.image }}"
        alt="{{ $book.title }}"
        title="{{ $book.title }}"
        class="h-auto max-w-full max-h-64 object-cover bg-theme border-theme border border-b-0"
      />
    </div>
    {{ end }}
  </div>
</article>
{{ end }}
